openapi: 3.0.3
info:
  title: Parko API
  description: >
    API de parqueo por hora multi-tenant. El precio y la disponibilidad se
    calculan siempre en el servidor; el pago se verifica con Stripe antes de
    marcar un ticket como pagado. Cada tenant (municipio o empresa) gestiona
    su propia tarifa, capacidad y usuarios.
  version: "2.0.0"
servers:
  - url: /api

paths:
  /auth/login:
    post:
      summary: Iniciar sesion (Admin General, Admin de Tenant o Usuario)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sesion iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Correo o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tenants:
    get:
      summary: Listar tenants (solo Admin General)
      tags: [Tenants]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Lista de tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Crear un tenant y su primer Admin de Tenant (solo Admin General)
      tags: [Tenants]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantInput"
      responses:
        "201":
          description: Tenant y admin creados
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant:
                    $ref: "#/components/schemas/Tenant"
                  admin:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      email: { type: string, format: email }
                      role: { type: string, enum: [TENANT_ADMIN] }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /tenants/{id}/suspend:
    post:
      summary: Suspender un tenant (solo Admin General)
      tags: [Tenants]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant suspendido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{id}/activate:
    post:
      summary: Reactivar un tenant (solo Admin General)
      tags: [Tenants]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant reactivado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users:
    get:
      summary: Listar usuarios de mi tenant (solo Admin de Tenant)
      tags: [Users]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Usuarios del tenant del llamador
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Crear un usuario en mi tenant (solo Admin de Tenant)
      tags: [Users]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantUserInput"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api-keys:
    get:
      summary: Listar mis API keys (Admin de Tenant o Admin General)
      description: >
        Un Admin de Tenant ve las keys de su tenant; un Admin General ve las
        suyas propias (sin tenant). Nunca se devuelve el secreto, solo el
        prefijo visible.
      tags: [ApiKeys]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Lista de API keys (sin el secreto)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeySummary"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Crear una API key (Admin de Tenant o Admin General)
      description: >
        Pensada para acceso de agentes/integraciones (ej. un servidor MCP),
        sin login interactivo. La key hereda el alcance de quien la crea —
        un Admin de Tenant no puede emitir una key de otro tenant ni de
        nivel SUPER_ADMIN. El valor completo solo se devuelve aqui, una vez.
      tags: [ApiKeys]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyInput"
      responses:
        "201":
          description: API key creada (unica vez que se muestra el valor completo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api-keys/{id}:
    delete:
      summary: Revocar una API key (Admin de Tenant o Admin General)
      tags: [ApiKeys]
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Key revocada (queda inutilizable de inmediato)
        "403":
          description: La key no pertenece a tu alcance (tenant o plataforma)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /tariffs/active:
    get:
      summary: Obtener la tarifa activa de un tenant (publico)
      tags: [Tariffs]
      parameters:
        - $ref: "#/components/parameters/TenantSlugQuery"
      responses:
        "200":
          description: Tarifa activa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tariff"
        "404":
          $ref: "#/components/responses/NotFound"

  /tariffs:
    get:
      summary: Listar las tarifas de mi tenant (solo Admin de Tenant)
      tags: [Tariffs]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Lista de tarifas del tenant del llamador
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tariff"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Crear una nueva tarifa activa para mi tenant (solo Admin de Tenant)
      tags: [Tariffs]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTariffInput"
      responses:
        "201":
          description: Tarifa creada y activada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tariff"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tariffs/{id}/deactivate:
    post:
      summary: Desactivar una tarifa de mi tenant (solo Admin de Tenant)
      tags: [Tariffs]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TariffId"
      responses:
        "200":
          description: Tarifa desactivada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tariff"
        "403":
          description: La tarifa no pertenece a tu tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /tickets:
    post:
      summary: Crear un ticket de parqueo para un tenant (publico; el precio se calcula en el servidor)
      tags: [Tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketInput"
      responses:
        "201":
          description: Ticket creado en estado PENDING_PAYMENT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: El tenant no existe o no tiene una tarifa activa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tickets/{id}:
    get:
      summary: Consultar el estado de un ticket (publico, por id opaco)
      tags: [Tickets]
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Ticket encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          $ref: "#/components/responses/NotFound"

  /tickets/{id}/checkout-session:
    post:
      summary: Crear una sesion de pago de Stripe Checkout para el ticket
      tags: [Tickets]
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "201":
          description: Sesion de checkout creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkoutUrl:
                    type: string
                    format: uri
                  sessionId:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /capacity/availability:
    get:
      summary: Disponibilidad publica de un tenant (nunca negativa)
      tags: [Capacity]
      parameters:
        - $ref: "#/components/parameters/TenantSlugQuery"
      responses:
        "200":
          description: Espacios totales y disponibles ahora mismo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
        "404":
          description: El tenant no existe o no tiene capacidad configurada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /capacity/status:
    get:
      summary: Estado completo de capacidad de mi tenant, incluyendo sobrecupo (solo Admin de Tenant)
      tags: [Capacity]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Estado de capacidad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapacityStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Mi tenant no tiene capacidad configurada todavia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /capacity:
    post:
      summary: Fijar un nuevo total de espacios para mi tenant y activarlo (solo Admin de Tenant)
      tags: [Capacity]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCapacityInput"
      responses:
        "201":
          description: Capacidad creada y activada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capacity"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /chat/session:
    post:
      summary: Obtener un token de sesion de chat (publico, solo desde el propio sitio)
      description: >
        El widget de Parko lo llama antes de mostrar el chat. Es POST (no
        GET) porque solo en metodos "unsafe" los navegadores garantizan el
        header Origin en una request same-origin; Referer no sirve aqui
        porque el servidor manda Referrer-Policy: no-referrer. Solo
        responde si el Origin apunta al mismo host que sirvio la pagina —
        asi un script externo no puede conseguir un token fuera del flujo
        del frontend. El token dura 2 minutos y queda ligado al tenant
        resuelto por tenantSlug.
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantSlug]
              properties:
                tenantSlug: { type: string, example: "demo" }
      responses:
        "200":
          description: Token de sesion de chat
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresIn: { type: integer, example: 120 }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No existe un tenant activo con ese slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chat:
    post:
      summary: Conversar con el asistente de Parko (requiere token de sesion de chat)
      description: >
        Chatbot con acceso exclusivamente a las mismas 6 tools publicas del
        servidor MCP (nunca a las de administracion). El cliente reenvia el
        historial completo en cada llamada — el servidor no guarda sesiones
        de chat. El mensaje "system" siempre lo controla el servidor, nunca
        el cliente. El tenant lo fija el token de POST /chat/session (header
        Authorization: Bearer <token>), no el body. Cada tenant tiene un
        tope diario de mensajes (CHAT_DAILY_MESSAGE_LIMIT, respaldo contra
        el costo de DeepSeek independiente de la autenticacion).
      tags: [Chat]
      security:
        - chatSessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequestInput"
      responses:
        "200":
          description: Respuesta del asistente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: El tenant alcanzo su tope diario de mensajes de chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: No se pudo conectar con el proveedor del modelo (DeepSeek)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Chat no configurado (falta DEEPSEEK_API_KEY)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /webhooks/stripe:
    post:
      summary: Webhook de Stripe (uso interno de Stripe, no invocar manualmente)
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Evento procesado (o duplicado ignorado)
        "400":
          description: Firma de webhook invalida o payload malformado

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Acepta dos tipos de credencial en el mismo header Authorization:
        un JWT obtenido en POST /auth/login (sesion humana, expira), o una
        API key con formato pk_<prefijo>_<secreto> creada en POST
        /api-keys (para agentes/integraciones, no expira hasta revocarse).
        En ambos casos el rol y el tenant van codificados en la credencial,
        nunca se envian por separado.
    chatSessionToken:
      type: http
      scheme: bearer
      description: >
        JWT de corta duracion (5 min) obtenido en GET /chat/session. Distinto
        de BearerAuth: no representa una sesion de usuario ni una API key,
        solo autoriza mensajes de chat para el tenant que quedo codificado
        al pedirlo.

  parameters:
    TicketId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TariffId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantSlugQuery:
      name: tenantSlug
      in: query
      required: true
      description: Identificador publico del tenant (municipio/empresa)
      schema:
        type: string
        example: "demo"

  responses:
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicto de estado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No hay sesion valida (falta el token o expiro)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Hay sesion valida, pero el rol o el tenant no tiene permiso para esta accion
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Datos de entrada invalidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              nullable: true

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      properties:
        token: { type: string, description: "JWT Bearer, incluir como Authorization: Bearer <token>" }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            role: { type: string, enum: [SUPER_ADMIN, TENANT_ADMIN, TENANT_USER] }
            tenantId: { type: string, format: uuid, nullable: true, description: "null solo para SUPER_ADMIN" }

    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateTenantInput:
      type: object
      required: [name, slug, adminEmail, adminPassword]
      properties:
        name: { type: string, example: "Ayuntamiento Demo" }
        slug: { type: string, example: "demo", description: "solo minusculas, numeros y guiones" }
        adminEmail: { type: string, format: email, example: "admin@demo.parko.dev" }
        adminPassword: { type: string, format: password, example: "una-contraseña-segura" }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [TENANT_ADMIN, TENANT_USER] }
        tenantId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    CreateTenantUserInput:
      type: object
      required: [email, password, role]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, example: "una-contraseña-segura" }
        role: { type: string, enum: [TENANT_ADMIN, TENANT_USER] }

    ChatRequestInput:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          maxItems: 20
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string, maxLength: 1000 }

    CreateApiKeyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, example: "Servidor MCP" }
        role:
          type: string
          enum: [TENANT_ADMIN, TENANT_USER]
          description: Solo aplica si quien crea la key es un Admin de Tenant; un Admin General siempre obtiene una key de su propio nivel.

    ApiKeySummary:
      type: object
      description: Nunca incluye el secreto, solo el prefijo visible.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, example: "0a3ec807d01c" }
        role: { type: string, enum: [SUPER_ADMIN, TENANT_ADMIN, TENANT_USER] }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKeySummary"
        - type: object
          properties:
            key:
              type: string
              example: "pk_0a3ec807d01c_1fb4a76e43fcd4261b236fee15f2d9c49c1430a480268411"
              description: Valor completo — se muestra UNA sola vez, guardalo ahora.

    Tariff:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        ratePerHourCents: { type: integer }
        dailyMaxCents: { type: integer }
        currency: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateTariffInput:
      type: object
      required: [name, ratePerHourCents, dailyMaxCents]
      properties:
        name: { type: string, example: "Tarifa estandar" }
        ratePerHourCents: { type: integer, example: 100 }
        dailyMaxCents: { type: integer, example: 800 }
        currency: { type: string, example: "usd" }

    CreateTicketInput:
      type: object
      required: [tenantSlug, hours]
      properties:
        tenantSlug: { type: string, example: "demo" }
        hours:
          type: number
          example: 3
          description: Horas de estacionamiento solicitadas (0.5 a 24)
        plate:
          type: string
          example: "A123456"

    Availability:
      type: object
      properties:
        totalSpaces: { type: integer }
        availableSpaces: { type: integer, minimum: 0, description: "max(total - ocupados, 0) — nunca negativo" }

    CapacityStatus:
      type: object
      properties:
        totalSpaces: { type: integer }
        occupiedSpaces: { type: integer, description: "puede superar totalSpaces (sobrecupo)" }
        isOverflowingNow: { type: boolean }
        lastOverflowAt: { type: string, format: date-time, nullable: true }
        lastOverflowAmount: { type: integer, nullable: true }

    CreateCapacityInput:
      type: object
      required: [totalSpaces]
      properties:
        totalSpaces: { type: integer, example: 40 }

    Capacity:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        totalSpaces: { type: integer }
        isActive: { type: boolean }
        lastOverflowAt: { type: string, format: date-time, nullable: true }
        lastOverflowAmount: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        plate: { type: string, nullable: true }
        hoursRequested: { type: number }
        tariffId: { type: string, format: uuid }
        ratePerHourCentsUsed: { type: integer }
        dailyMaxCentsUsed: { type: integer }
        amountCents: { type: integer }
        currency: { type: string }
        status:
          type: string
